services:
  - type: web
    name: smart-restaurant-analytics
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_DATA
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_CUSTOMER_PASSWORD
        sync: false
